name: alsdb-docs
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  # Core alsdb dependencies (conda-forge)
  - pdal>=2.7
  - python-pdal>=3.4
  - tiledb>=0.28
  - zarr>=3.0
  - numpy>=1.26
  - pyarrow>=14.0
  - click>=8.1
  - xarray>=2024.1
  - pandas>=2.0
  - scipy>=1.12
  - matplotlib>=3.8
  - rioxarray>=0.15
  # Sphinx and extensions
  - sphinx>=7.0
  - pydata-sphinx-theme>=0.15
  - sphinx-design>=0.5
  - sphinx-copybutton>=0.5
  - sphinx-gallery>=0.15
  - sphinx-inline-tabs>=2023.4
  - numpydoc>=1.6
  - sphinxcontrib-mermaid>=0.9
  - ipython>=8.0
  - pip
  - pip:
    - sphinx-autosummary-accessors
    - sphinx-remove-toctrees
