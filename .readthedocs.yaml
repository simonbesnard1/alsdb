version: 2

sphinx:
  configuration: doc/conf.py
  fail_on_warning: false

# A plain Python environment from pip: conf.py mocks pdal and tiledb for autodoc, so the
# compiled stack is not needed. The former conda environment ("mamba env create --quiet")
# printed nothing while solving and builds were terminated for inactivity.
build:
  os: ubuntu-22.04
  tools:
    python: "3.12"
  jobs:
    post_checkout:
      - (git --no-pager log --pretty="tformat:%s" -1 | grep -vqF "[skip-rtd]") || exit 183
      - git fetch --unshallow || true
    post_install:
      - pip install -e . --no-deps

python:
  install:
    - requirements: ci/requirements/doc.txt

formats: []
