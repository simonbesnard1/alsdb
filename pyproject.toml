[project]
name = "alsdb"
version = "0.1.0"
description = "Airborne Laser Scanning point clouds — from LAZ to TileDB, with gridded product and waveform simulation pipelines"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "EUPL-1.2" }
authors = [
    { name = "Simon Besnard", email = "simon.besnard@gfz.de" },
]
keywords = [
    "lidar", "als", "airborne laser scanning", "point cloud",
    "tiledb", "zarr", "canopy height", "biomass", "gedi", "remote sensing",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "License :: OSI Approved :: European Union Public Licence 1.2 (EUPL 1.2)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = [
    "tiledb==0.35.2",
    "zarr>=3.0",
    "numpy>=1.26",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "scipy>=1.12",
    "matplotlib>=3.8",
    "click>=8.1",
    "xarray>=2024.1",
    "retry>=0.9",
]

[project.optional-dependencies]
crs = ["rioxarray>=0.15"]
s3  = ["boto3>=1.34", "s3fs>=2024.2"]
ml  = ["scikit-learn>=1.3", "joblib>=1.3"]

[project.urls]
Homepage = "https://github.com/simonbesnard1/alsdb"
Repository = "https://github.com/simonbesnard1/alsdb"
"Bug Tracker" = "https://github.com/simonbesnard1/alsdb/issues"

[project.scripts]
alsdb = "alsdb.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["alsdb"]

[tool.hatch.build.targets.wheel.force-include]
"alsdb/data" = "alsdb/data"

[tool.pixi.workspace]
name = "alsdb"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]

[tool.pixi.dependencies]
python = ">=3.11"
pdal = ">=2.7"
python-pdal = ">=3.4"
zarr = ">=3.0"
numpy = ">=1.26"
pyarrow = ">=14.0"
click = ">=8.1"
xarray = ">=2024.1"
pandas = ">=2.0"
scipy = ">=1.12"
matplotlib = ">=3.8"
rioxarray = ">=0.15"
boto3 = ">=1.34"
s3fs = ">=2024.2"
retry = ">=0.9"
pytest = ">=8.0"
pytest-cov = ">=5.0"
scikit-learn = ">=1.3"
joblib = ">=1.3"

[tool.pixi.pypi-dependencies]
alsdb = { path = ".", editable = true }
tiledb = "==0.35.2"

[tool.pixi.tasks]
test = "pytest tests/ -v"
ingest = "alsdb ingest"
info = "alsdb info"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

# Optional compiled constrained-Delaunay backend.
[tool.pixi.feature.spikefree.dependencies]
cgal-cpp = ">=6,<7"
pybind11 = ">=2.13"
cxx-compiler = "*"

[tool.pixi.feature.spikefree.tasks]
build-spikefree = "python -m alsdb.processing._build_spikefree"

# Optional R + lasR (r-lidar, GPL-3) for the alsdb.benchmark.lasr reference.
# lasR is compiled from r-universe into the env: pixi run -e lasr install-lasr
[tool.pixi.feature.lasr.dependencies]
python = "3.14.*"  # tiledb 0.35.2 has no 3.15 wheel
r-base = "4.4.*"
r-terra = "*"
r-codetools = "*"
libgdal = "*"
geos = "*"
proj = "*"
cxx-compiler = "*"
make = "*"
pkg-config = "*"

[tool.pixi.feature.lasr.tasks]
install-lasr = "Rscript -e \"install.packages('lasR', repos = c('https://r-lidar.r-universe.dev', 'https://cloud.r-project.org'), Ncpus = 4)\""

# Optional HELIOS++ (LGPL-3) LiDAR simulator for alsdb.benchmark.synthetic.
# Own minimal environment: conda-forge builds stop at Python 3.12, and it only
# runs simulations (scene files are written from the default environment).
[tool.pixi.feature.helios.dependencies]
python = "3.12.*"
helios = ">=2.2.2"

[tool.pixi.environments]
default = { features = [] }
spikefree = { features = ["spikefree"] }
lasr = { features = ["lasr"] }
helios = { features = ["helios"], no-default-feature = true }
