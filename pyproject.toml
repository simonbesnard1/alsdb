[project]
name = "alsdb"
version = "0.1.0"
description = "Airborne Laser Scanning point clouds — from LAZ to TileDB, with gridded product and waveform simulation pipelines"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "EUPL-1.2" }
authors = [
    { name = "Simon Besnard", email = "simon.besnard@gfz.de" },
]
keywords = [
    "lidar", "als", "airborne laser scanning", "point cloud",
    "tiledb", "zarr", "canopy height", "biomass", "gedi", "remote sensing",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "License :: OSI Approved :: European Union Public Licence 1.2 (EUPL 1.2)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = [
    "tiledb==0.35.2",
    "zarr>=3.0",
    "numpy>=1.26",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "scipy>=1.12",
    "matplotlib>=3.8",
    "click>=8.1",
    "xarray>=2024.1",
    "retry>=0.9",
    "rasterio>=1.3",  # TIN rasterisation of the tin and pitfree CHMs
    "pyproj>=3.6",  # CRS parsing of tile metadata
]

[project.optional-dependencies]
crs = ["rioxarray>=0.15"]
s3  = ["boto3>=1.34", "s3fs>=2024.2"]
ml  = ["scikit-learn>=1.3", "joblib>=1.3"]
torch = ["torch>=2.0", "joblib>=1.3"]
gedi = ["gedidb", "geopandas"]

[project.urls]
Homepage = "https://github.com/simonbesnard1/alsdb"
Repository = "https://github.com/simonbesnard1/alsdb"
"Bug Tracker" = "https://github.com/simonbesnard1/alsdb/issues"

[project.scripts]
alsdb = "alsdb.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["alsdb"]

[tool.hatch.build.targets.wheel.force-include]
"alsdb/data" = "alsdb/data"

[tool.pixi.workspace]
name = "alsdb"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]

[tool.pixi.dependencies]
python = ">=3.11"
pdal = ">=2.7"
python-pdal = ">=3.4"
zarr = ">=3.0"
numpy = ">=1.26"
pyarrow = ">=14.0"
click = ">=8.1"
xarray = ">=2024.1"
pandas = ">=2.0"
scipy = ">=1.12"
matplotlib = ">=3.8"
rioxarray = ">=0.15"
boto3 = ">=1.34"
s3fs = ">=2024.2"
retry = ">=0.9"
pytest = ">=8.0"
pytest-cov = ">=5.0"
scikit-learn = ">=1.3"
joblib = ">=1.3"

[tool.pixi.pypi-dependencies]
alsdb = { path = ".", editable = true }
tiledb = "==0.35.2"

[tool.pixi.tasks]
test = "pytest tests/ -v"
ingest = "alsdb ingest"
info = "alsdb info"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]  # test functions are named for what they check
"doc/gallery/**" = ["D205", "D400"]  # sphinx-gallery titles: a heading line, then underline

# Optional compiled constrained-Delaunay backend.
[tool.pixi.feature.spikefree.dependencies]
cgal-cpp = ">=6,<7"
# libpdal-hdf 2.10 is built against HDF5 2 but does not require it; without
# this pin the solver pairs it with HDF5 1.14 and PDAL prints plugin errors.
hdf5 = ">=2"
pybind11 = ">=2.13"
cxx-compiler = "*"

[tool.pixi.feature.spikefree.tasks]
build-spikefree = "python -m alsdb.methods._build_spikefree"

# Optional R + lasR (r-lidar, GPL-3) for the alsdb.benchmark.lasr reference.
# lasR is compiled from r-universe into the env: pixi run -e lasr install-lasr
[tool.pixi.feature.lasr.dependencies]
python = "3.14.*"  # tiledb 0.35.2 has no 3.15 wheel
r-base = "4.4.*"
r-terra = "*"
r-codetools = "*"
libgdal = "*"
geos = "*"
proj = "*"
cxx-compiler = "*"
make = "*"
pkg-config = "*"
# As in spikefree: libpdal-hdf needs HDF5 2 but does not declare it, and
# without the pin every PDAL call printed HDF plugin load errors.
hdf5 = ">=2"
# libpdal-tiledb 2.10.2 build 5 links libaws-c-s3.so.1.1 without requiring
# it, while hdf5 2.2 requires aws-c-s3 1.0: unsatisfiable. Keep the earlier,
# consistent set that spikefree resolves to (TileDB plugin load errors otherwise).
aws-c-s3 = "<1"

[tool.pixi.feature.lasr.tasks]
install-lasr = "Rscript -e \"install.packages('lasR', repos = c('https://r-lidar.r-universe.dev', 'https://cloud.r-project.org'), Ncpus = 4)\""

# Optional HELIOS++ (LGPL-3) LiDAR simulator for alsdb.benchmark.synthetic.
# Own minimal environment: conda-forge builds stop at Python 3.12, and it only
# runs simulations (scene files are written from the default environment).
[tool.pixi.feature.helios.dependencies]
python = "3.12.*"
helios = ">=2.2.2"

# Optional gedidb (GFZ) for alsdb.products.gedi_attenuation: real GEDI L2A/L2B
# shots next to the simulated ones. gedidb from git (below); its compiled dependencies
# from conda-forge (numba pins the Python version it supports).
[tool.pixi.feature.gedi.dependencies]
python = "3.13.*"
numba = ">=0.62"
dask = ">=2025.10"
distributed = ">=2025.9"
geopandas = ">=1.1"
h5py = ">=3.14"
# As in lasr: without these, PDAL's TileDB and HDF plugins fail to load (libaws-c-s3.so.1.1).
hdf5 = ">=2"
aws-c-s3 = "<1"

[tool.pixi.feature.gedi.activation.env]
PYTHONNOUSERSITE = "1"  # packages in ~/.local/lib/python3.13 otherwise shadow the environment's

[tool.pixi.feature.gedi.pypi-dependencies]
# From git: the 2026.04.30 release predates the s3.gfz.de access point and the
# batched S3 reads, and its query exhausted 14 GB on a 4 km2 block.
gedidb = { git = "https://github.com/simonbesnard1/gedidb.git", rev = "a75ff1e58a98074bd71c02b2d3d2da44ee5f4f47" }

[tool.pixi.environments]
default = { features = [] }
spikefree = { features = ["spikefree"] }
lasr = { features = ["lasr"] }
helios = { features = ["helios"], no-default-feature = true }
gedi = { features = ["gedi"] }
