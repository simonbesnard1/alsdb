[project]
name = "alsdb"
version = "0.1.0"
description = "Airborne Laser Scanning point clouds — from LAZ to TileDB, with gridded product and waveform simulation pipelines"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "EUPL-1.2" }
authors = [
    { name = "Simon Besnard", email = "simon.besnard@gfz.de" },
]
keywords = [
    "lidar", "als", "airborne laser scanning", "point cloud",
    "tiledb", "zarr", "canopy height", "biomass", "gedi", "remote sensing",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "License :: OSI Approved :: European Union Public Licence 1.2 (EUPL 1.2)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = [
    "tiledb==0.35.2",
    "zarr>=3.0",
    "numpy>=1.26",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "scipy>=1.12",
    "matplotlib>=3.8",
    "click>=8.1",
    "xarray>=2024.1",
    "retry>=0.9",
]

[project.optional-dependencies]
crs = ["rioxarray>=0.15"]
s3  = ["boto3>=1.34", "s3fs>=2024.2"]

[project.urls]
Homepage = "https://github.com/simonbesnard1/alsdb"
Repository = "https://github.com/simonbesnard1/alsdb"
"Bug Tracker" = "https://github.com/simonbesnard1/alsdb/issues"

[project.scripts]
alsdb = "alsdb.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["alsdb"]

[tool.hatch.build.targets.wheel.force-include]
"alsdb/data" = "alsdb/data"

[tool.pixi.workspace]
name = "alsdb"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]

[tool.pixi.dependencies]
python = ">=3.11"
pdal = ">=2.7"
python-pdal = ">=3.4"
zarr = ">=3.0"
numpy = ">=1.26"
pyarrow = ">=14.0"
click = ">=8.1"
xarray = ">=2024.1"
pandas = ">=2.0"
scipy = ">=1.12"
matplotlib = ">=3.8"
rioxarray = ">=0.15"
boto3 = ">=1.34"
s3fs = ">=2024.2"
retry = ">=0.9"
pytest = ">=8.0"
pytest-cov = ">=5.0"

[tool.pixi.pypi-dependencies]
alsdb = { path = ".", editable = true }
tiledb = "==0.35.2"

[tool.pixi.tasks]
test = "pytest tests/ -v"
ingest = "alsdb ingest"
info = "alsdb info"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
