[project]
name = "alsdb"
version = "0.1.0"
description = "ALS point cloud database — ingest PNOA LAZ tiles into TileDB on S3"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
alsdb = "alsdb.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pixi.project]
name = "alsdb"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]

[tool.pixi.dependencies]
python = ">=3.11"
pdal = ">=2.7"
python-pdal = ">=3.4"
tiledb = ">=0.28"
numpy = ">=1.26"
click = ">=8.1"
xarray = ">=2024.1"
pandas = ">=2.0"
scipy = ">=1.12"
matplotlib = ">=3.8"
rasterio = ">=1.3"
pytest = ">=8.0"

[tool.pixi.pypi-dependencies]
alsdb = { path = ".", editable = true }

[tool.pixi.tasks]
test = "pytest tests/ -v"
ingest = "alsdb ingest"
info = "alsdb info"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
