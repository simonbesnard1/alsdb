[project]
name = "alsdb"
version = "0.1.0"
description = "ALS point cloud database — ingest PNOA LAZ tiles into TileDB on S3"
requires-python = ">=3.11"
dependencies = [
    "tiledb>=0.28",
    "zarr>=3.0",
    "numpy>=1.26",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "scipy>=1.12",
    "matplotlib>=3.8",
    "click>=8.1",
    "xarray>=2024.1",
]

[project.optional-dependencies]
crs = ["rioxarray>=0.15"]

[project.scripts]
alsdb = "alsdb.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["alsdb/**"]

[tool.pixi.workspace]
name = "alsdb"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]

[tool.pixi.dependencies]
python = ">=3.11"
pdal = ">=2.7"
python-pdal = ">=3.4"
tiledb = ">=0.28"
zarr = ">=3.0"
numpy = ">=1.26"
pyarrow = ">=14.0"
click = ">=8.1"
xarray = ">=2024.1"
pandas = ">=2.0"
scipy = ">=1.12"
matplotlib = ">=3.8"
rioxarray = ">=0.15"
pytest = ">=8.0"

[tool.pixi.tasks]
test = "pytest tests/ -v"
ingest = "alsdb ingest"
info = "alsdb info"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
